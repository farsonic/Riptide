# Riptide configuration for networking through UAE's uaenet.device
# (WinUAE / FS-UAE). Copy to ENV:Riptide/riptide.conf (or ENVARC:) or start
# with:  Run >NIL: Riptide CONFIG=<this file>
#
# uaenet.device is supplied by the emulator itself, so give it by name
# without a DEVS:Networks/ path. unit= picks the host network adapter
# (0 = first one listed in the emulator's network settings).

hostname amiga
domain   lan

# --- the interface -------------------------------------------------------
# tcpwindow=1440: FS-UAE 3.x (3.1.66, 3.2.35) hands the Amiga only the
# first of the frames waiting for it and drops the rest, so a TCP download
# loses a segment in every burst and stalls for seconds. With a one-segment
# receive window slirp never queues two frames at once. Remove it under
# WinUAE or a fixed FS-UAE: a bigger window is faster there.
interface eth0 device=uaenet.device unit=0 mtu=1500 tcpwindow=1440

# --- address: pick ONE of the two blocks --------------------------------

# 1) DHCP. Works when the emulator's network is bridged to a LAN with a
#    DHCP server, or when the emulator uses slirp (user-mode NAT), whose
#    built-in DHCP server answers. Router and nameservers come from the lease.
dhcp eth0

# 2) Static. Example values for slirp NAT (guest 10.0.2.15, gateway
#    10.0.2.2, slirp DNS forwarder 10.0.2.3). For a bridged LAN use your
#    own subnet instead.
#ifconfig  eth0 10.0.2.15/24 up
#route     add default 10.0.2.2
#nameserver 10.0.2.3

# Check from a shell with:  ip a   ip r   ip dhcp   ping -c 3 10.0.2.2
# Change at run time with, e.g.:  ip route replace default via 10.0.2.2
#                                 ip dhcp renew dev eth0   ip dns add 1.1.1.1

# --- names ---------------------------------------------------------------
# Static host entries (also used when DNS is disallowed)
host amiga 127.0.0.1

# --- optional TCP tuning (Linux-style defaults are already set) ----------
#sysctl net.inet.tcp.cc=cubic           # or reno
#sysctl net.inet.tcp.recvspace=65536
#sysctl net.inet.tcp.sendspace=32768
#sysctl net.inet.tcp.ecn=2              # 1 = request ECN on outgoing connections
